<title>Akademya Tagalog</title>
<meta name="theme-color" content="#1652C8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&family=Noto+Sans+Tagalog&display=swap">
<style>
/* Layout : coquille d'application — rail à gauche + colonne de stats à droite sur ordinateur,
   barre d'onglets en bas sur téléphone et tablette portrait ; colonne centrale ~680px ;
   lecteur de leçon plein écran. Motifs : enseigne de jeepney pour les sections, tissage banig sur
   les bannières d'unité, Araw le soleil (mascotte habillée selon la météo de Nice), couleurs du drapeau. */
:root{
  --bg:#F1F5FB; --surface:#FFFFFF; --surface-2:#E8EEF8; --surface-3:#DCE5F3;
  --ink:#13203A; --ink-2:#4A5877; --ink-3:#8190AE; --line:#D6DFEE;
  --dagat:#1652C8; --dagat-d:#0D3A94; --dagat-soft:#DCE7FC;
  --araw:#F2B300; --araw-d:#B98600; --araw-soft:#FFF2C8;
  --pula:#D7263D; --pula-d:#A1172A; --pula-soft:#FDE1E4;
  --tama:#1F9D55; --tama-d:#157540; --tama-soft:#DBF5E5;
  --lock:#C9D3E4; --lock-d:#A9B6CC;
  --s1:#1652C8; --s1-d:#0D3A94; --s2:#0F8C76; --s2-d:#0A6656; --s3:#D9652A; --s3-d:#A84A1A; --s4:#C02D52; --s4-d:#8E1E3B; --s5:#4C3FB4; --s5-d:#352B86;
  --shadow:0 1px 2px rgba(19,32,58,.06),0 6px 18px rgba(19,32,58,.07);
  --f-disp:'Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --f-bay:'Noto Sans Tagalog','Noto Sans',sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1323; --surface:#141E34; --surface-2:#1B2741; --surface-3:#24324F;
  --ink:#E8EEF9; --ink-2:#A8B5D0; --ink-3:#6E7C9C; --line:#25324E;
  --dagat:#4F8BF5; --dagat-d:#2D63C4; --dagat-soft:#1A2D55;
  --araw:#FFC629; --araw-d:#C99400; --araw-soft:#3A3010;
  --pula:#F2546A; --pula-d:#B8304A; --pula-soft:#46202A;
  --tama:#38C474; --tama-d:#23934F; --tama-soft:#163A28;
  --lock:#2A3755; --lock-d:#1E2A44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1323; --surface:#141E34; --surface-2:#1B2741; --surface-3:#24324F;
  --ink:#E8EEF9; --ink-2:#A8B5D0; --ink-3:#6E7C9C; --line:#25324E;
  --dagat:#4F8BF5; --dagat-d:#2D63C4; --dagat-soft:#1A2D55;
  --araw:#FFC629; --araw-d:#C99400; --araw-soft:#3A3010;
  --pula:#F2546A; --pula-d:#B8304A; --pula-soft:#46202A;
  --tama:#38C474; --tama-d:#23934F; --tama-soft:#163A28;
  --lock:#2A3755; --lock-d:#1E2A44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-disp);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
a{color:var(--dagat)}
:focus-visible{outline:3px solid var(--araw);outline-offset:2px;border-radius:8px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ico{display:inline-grid;place-items:center;flex:none}
.ico svg{width:1.25em;height:1.25em}

/* ====== Coquille ====== */
.app{min-height:100%;display:grid;grid-template-columns:1fr}
.rail,.side{display:none}
.main{min-width:0;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:2px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:.7rem;font-weight:800;color:var(--ink-3)}
.tab .ico svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--dagat);background:var(--dagat-soft)}
@media (min-width:900px){
  .app{grid-template-columns:232px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:22px 14px;border-right:2px solid var(--line);background:var(--surface)}
  .tabbar{display:none}
  .main{padding:0 28px 48px}
}
@media (min-width:1220px){
  .app{grid-template-columns:232px minmax(0,1fr) 330px}
  .side{display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 20px 22px 4px}
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:1.45rem;color:var(--dagat);padding:2px 10px 16px}
.brand svg{width:40px;height:40px;flex:none}
.brand small{display:block;font-family:var(--f-body);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:800;margin-top:-4px}
.rail-btn{display:flex;align-items:center;gap:14px;border:2px solid transparent;background:none;border-radius:14px;padding:10px 14px;font-weight:800;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);text-align:left}
.rail-btn .ico svg{width:28px;height:28px}
.rail-btn:hover{background:var(--surface-2)}
.rail-btn[aria-current="page"]{color:var(--dagat);background:var(--dagat-soft);border-color:color-mix(in srgb,var(--dagat) 35%,transparent)}
.rail-foot{margin-top:auto;font-size:.78rem;color:var(--ink-3);padding:0 10px}

/* Barre du haut (mobile/tablette) */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;background:var(--bg);margin:0 -16px;padding-inline:16px;border-bottom:2px solid var(--line)}
@media (min-width:900px){.topbar{margin:0 -28px;padding-inline:28px}}
@media (min-width:1220px){.topbar{display:none}}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:.95rem;padding:5px 9px;border-radius:12px;background:none;border:0}
.stat .ico svg{width:22px;height:22px}
.stat.streak{color:#E8710A}.stat.streak.off{color:var(--ink-3)}
.stat.gems{color:#1C8FD0}
.stat.hearts{color:var(--pula)}
.stat.xp{color:var(--araw-d)}
:root[data-theme="dark"] .stat.xp{color:var(--araw)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat.xp{color:var(--araw)}}
.sec-pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.8rem;border-radius:10px;padding:4px 10px;color:#fff}

/* ====== Éléments communs ====== */
.view{max-width:680px;margin:0 auto;padding-top:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.view>*{min-width:0}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.section-h h2{font-size:1.4rem}
.btn{--c:var(--surface);--cd:var(--line);--fg:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;border:2px solid var(--cd);border-bottom-width:5px;background:var(--c);color:var(--fg);font-weight:800;font-size:.95rem;letter-spacing:.05em;text-transform:uppercase;transition:transform .08s,filter .15s,background-color .25s,border-color .25s,color .25s}
.btn:active{transform:translateY(2px);border-bottom-width:3px}
.btn:hover{filter:brightness(1.04)}
.btn.primary{--c:var(--dagat);--cd:var(--dagat-d);--fg:#fff}
.btn.ok{--c:var(--tama);--cd:var(--tama-d);--fg:#fff}
.btn.bad{--c:var(--pula);--cd:var(--pula-d);--fg:#fff}
.btn.gold{--c:var(--araw);--cd:var(--araw-d);--fg:#3A2800}
.btn.ghost{--c:transparent;--cd:transparent;border-bottom-width:2px;color:var(--dagat)}
.btn:disabled,.btn[disabled]{--c:var(--surface-3);--cd:var(--surface-3);--fg:var(--ink-3);color:var(--ink-3);cursor:not-allowed;filter:none;transform:none}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.8rem;border-bottom-width:4px}
.btn .ico svg{width:20px;height:20px}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:none;color:var(--ink-3)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:26px;height:26px}
.meter{height:16px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.meter i{display:block;height:100%;border-radius:99px;background:var(--tama);transition:width .45s cubic-bezier(.3,1.3,.5,1);position:relative}
.meter i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.meter.gold i{background:var(--araw)}
.meter.thin{height:10px}
.meter.thin i::after{display:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:120;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:800;font-size:.92rem;transition:all .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){.toast{bottom:28px}}
.empty{color:var(--ink-3);text-align:center;padding:26px 10px;display:grid;gap:10px;justify-items:center}
.tl{font-family:var(--f-disp);font-weight:700;color:var(--dagat)}
.tl-say{cursor:pointer;text-decoration:underline dotted 2px;text-underline-offset:3px}
.kbd{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:7px;border:2px solid var(--line);font-size:.75rem;font-weight:800;color:var(--ink-3)}

/* ====== Côté droit (grand écran) ====== */
.side .panel{display:grid;gap:12px}
.side h3{font-size:1.15rem}
.side-stats{display:flex;justify-content:space-between;gap:6px;padding:4px 2px}
.quest{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.quest .ico svg{width:30px;height:30px}
.quest b{font-size:.9rem;display:block;margin-bottom:4px}
.quest.done .meter i{background:var(--araw)}

/* ====== Apprendre : enseigne de section ====== */
.sign{--sc:var(--s1);--scd:var(--s1-d);position:relative;border-radius:18px;background:var(--sc);color:#fff;padding:14px 16px 14px 18px;border-bottom:6px solid var(--scd);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;overflow:hidden}
.sign::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:repeating-linear-gradient(180deg,#FCD116 0 10px,#CE1126 10px 20px,#fff 20px 30px,#0038A8 30px 40px)}
.sign .route{font-family:var(--f-disp);font-weight:800;font-size:1.5rem;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.sign .via{font-size:.82rem;font-weight:700;opacity:.9;letter-spacing:.06em;text-transform:uppercase}
.sign .code{font-family:var(--f-disp);font-weight:800;font-size:1.05rem;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);border-radius:10px;padding:2px 10px;justify-self:end}
.sign p{grid-column:1/-1;font-size:.9rem;opacity:.92}
.sign .btn{grid-column:1/-1;justify-self:start}
.sign.locked{filter:saturate(.25) brightness(.95)}

/* Bannière d'unité (tissage banig) */
.unit{display:grid;gap:8px}
.ubanner{--uc:var(--s1);--ucd:var(--s1-d);position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;background:var(--uc);color:#fff;border-bottom:5px solid var(--ucd);overflow:hidden;isolation:isolate}
.ubanner::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.16;background:
  repeating-linear-gradient(45deg,#fff 0 6px,transparent 6px 12px),
  repeating-linear-gradient(-45deg,#fff 0 6px,transparent 6px 12px);
  -webkit-mask:linear-gradient(90deg,transparent 35%,#000 100%);mask:linear-gradient(90deg,transparent 35%,#000 100%)}
.ubanner .un{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.ubanner h3{font-size:1.3rem}
.ubanner .ut{font-weight:700;font-size:.92rem;opacity:.92;font-style:italic}
.gbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase}
.gbtn:hover{background:rgba(255,255,255,.26)}
.gbtn svg{width:20px;height:20px}
.ubanner.locked{--uc:var(--lock);--ucd:var(--lock-d);color:var(--ink-2)}
.ubanner.locked .gbtn{color:var(--ink-2);border-color:var(--ink-3)}

/* Chemin */
.path{position:relative;display:grid;justify-items:center;gap:14px;padding:14px 0 22px}
.node-wrap{--nc:var(--s1);--ncd:var(--s1-d);position:relative;display:grid;justify-items:center;transform:translateX(var(--x,0))}
.node-wrap.has-tip{margin-top:46px}
.node-wrap.open{z-index:25}
.node{position:relative;width:70px;height:64px;border-radius:50%;border:0;background:var(--nc);box-shadow:0 7px 0 var(--ncd);color:#fff;display:grid;place-items:center;transition:transform .1s}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 var(--ncd)}
.node svg{width:32px;height:32px}
.node.locked{--nc:var(--lock);--ncd:var(--lock-d);color:var(--ink-3)}
.node.done{--nc:var(--araw);--ncd:var(--araw-d);color:#4A3500}
.node.story{border-radius:20px;width:74px}
.node.boss{width:82px;height:72px}
.node.current::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid var(--surface-3)}
.node.current::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:5px solid var(--nc);clip-path:inset(0 0 calc(100% - var(--pct,0%)) 0)}
.start-tip{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:var(--nc,var(--dagat));font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.start-tip::after{content:"";position:absolute;top:100%;left:50%;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
.node-label{margin-top:12px;font-size:.78rem;font-weight:800;color:var(--ink-3);max-width:140px;text-align:center;line-height:1.2}
.pop{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(calc(-50% - var(--x,0px)));z-index:20;width:min(300px,calc(100vw - 40px));background:var(--nc,var(--dagat));color:#fff;border-radius:16px;padding:14px;display:grid;gap:10px;box-shadow:var(--shadow);text-align:left}
.pop.locked{background:var(--surface-2);color:var(--ink-2);border:2px solid var(--line)}
.pop h4{font-size:1.1rem}
.pop .btn{--c:#fff;--cd:rgba(0,0,0,.18);--fg:var(--nc,var(--dagat))}
.pop.locked .btn{--c:var(--surface-3);--cd:var(--surface-3);--fg:var(--ink-3)}
.mascot-aside{position:absolute;width:96px;height:96px;opacity:.95;pointer-events:none}
@media (max-width:420px){.mascot-aside{display:none}}

/* ====== Lecteur de leçon ====== */
.player{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px)}
.ph{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;max-width:780px;width:100%;margin:0 auto;padding:14px 16px 8px}
.ph .meter{height:18px}
.ph .hearts{display:inline-flex;align-items:center;gap:5px;font-weight:800;color:var(--pula)}
.ph .hearts svg{width:26px;height:26px}
.ph .hearts.inf{color:var(--ink-3)}
.pbody{overflow-y:auto;overscroll-behavior:contain;padding:10px 16px 24px}
.pbody>.inner{max-width:640px;margin:0 auto;display:grid;gap:18px;min-height:100%;align-content:start}
.pfoot{border-top:2px solid var(--line);background:var(--bg);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));transition:background .2s}
.pfoot .inner{max-width:640px;margin:0 auto;display:grid;gap:12px}
.pfoot.ok{background:var(--tama-soft);border-color:transparent}
.pfoot.bad{background:var(--pula-soft);border-color:transparent}
.fb{display:none;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.pfoot.ok .fb,.pfoot.bad .fb{display:grid}
.fb .badge-ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--tama)}
.pfoot.bad .fb .badge-ic{color:var(--pula)}
.fb .badge-ic svg{width:30px;height:30px}
.fb h3{font-size:1.4rem;color:var(--tama-d)}
.pfoot.bad .fb h3{color:var(--pula-d)}
:root[data-theme="dark"] .fb h3{color:var(--tama)}
:root[data-theme="dark"] .pfoot.bad .fb h3{color:var(--pula)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fb h3{color:var(--tama)}:root:not([data-theme="light"]) .pfoot.bad .fb h3{color:var(--pula)}}
.fb .ans{font-weight:700;margin-top:2px}
.fb .expl{font-size:.92rem;color:var(--ink-2);margin-top:4px}
.fb .combo{display:inline-block;margin-top:4px;font-weight:800;color:var(--araw-d);font-size:.85rem}
.pacts{display:flex;gap:12px;justify-content:space-between;align-items:center}
.pacts .btn{flex:1}
@media (min-width:700px){.pacts .btn{flex:0 0 auto;min-width:170px}}

.ex-h{display:grid;gap:6px}
.ex-h .tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7A4BD8}
.ex-h .tag.new{color:#C95A00}
.ex-h h2{font-size:1.5rem}
.prompt-row{display:flex;align-items:flex-start;gap:12px}
.say{display:inline-grid;place-items:center;flex:none;width:52px;height:52px;border-radius:14px;border:0;background:var(--dagat);color:#fff;box-shadow:0 4px 0 var(--dagat-d)}
.say:active{transform:translateY(3px);box-shadow:0 1px 0 var(--dagat-d)}
.say svg{width:28px;height:28px}
.say.slow{width:40px;height:40px;background:var(--dagat-soft);color:var(--dagat);box-shadow:0 3px 0 var(--surface-3)}
.say.slow svg{width:22px;height:22px}
.say.big{width:120px;height:120px;border-radius:26px;box-shadow:0 7px 0 var(--dagat-d)}
.say.big svg{width:56px;height:56px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:1.15rem;font-weight:600;min-width:0}
.tl-line{font-family:var(--f-disp);font-weight:700;font-size:1.3rem;line-height:1.35;color:var(--ink)}
.tok{cursor:pointer;border-bottom:2px dashed var(--ink-3);padding-bottom:1px;position:relative}
.tok:hover{color:var(--dagat);border-color:var(--dagat)}
.gloss{position:fixed;z-index:200;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:.9rem;font-weight:700;max-width:260px;pointer-events:none}
.gloss b{font-family:var(--f-disp);color:var(--dagat)}
.note{font-size:.88rem;color:var(--ink-2);font-style:italic}

/* Options */
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-weight:700;font-size:1.02rem;min-height:56px}
.opt:hover{background:var(--surface-2)}
.opt.sel{border-color:var(--dagat);background:var(--dagat-soft);color:var(--dagat)}
.opt.right{border-color:var(--tama);background:var(--tama-soft);color:var(--tama-d)}
.opt.wrong{border-color:var(--pula);background:var(--pula-soft);color:var(--pula-d)}
.opt.tlo{font-family:var(--f-disp);font-size:1.12rem}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.pic{display:grid;gap:6px;justify-items:center;padding:14px 10px 12px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-family:var(--f-disp);font-weight:700;font-size:1.08rem}
.pic .em{font-size:3.4rem;line-height:1.1}
.pic .em.txt{font-family:var(--f-disp);font-weight:800;font-size:2.2rem;color:var(--ink-2);height:3.75rem;display:grid;place-items:center}
.pic:hover{background:var(--surface-2)}
.pic.sel{border-color:var(--dagat);background:var(--dagat-soft)}
.pic.right{border-color:var(--tama);background:var(--tama-soft)}
.pic.wrong{border-color:var(--pula);background:var(--pula-soft)}

/* Paires */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:10px;align-content:start}
.pb{min-height:56px;padding:10px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-weight:700;font-size:.98rem;line-height:1.25}
.pb.tlo{font-family:var(--f-disp);font-size:1.08rem}
.pb.sel{border-color:var(--dagat);background:var(--dagat-soft);color:var(--dagat)}
.pb.gone{opacity:.35;border-style:dashed;pointer-events:none;background:transparent}
.pb.flash{border-color:var(--pula);background:var(--pula-soft);animation:shake .3s}
.pb.good{border-color:var(--tama);background:var(--tama-soft)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Banque de mots */
.answer-zone{min-height:118px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:linear-gradient(transparent 58px,var(--line) 58px,var(--line) 60px,transparent 60px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.tile{padding:9px 13px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-weight:700;font-size:1.02rem;min-height:46px;line-height:1.2}
.tile.tlo{font-family:var(--f-disp);font-size:1.1rem}
.tile.ghost{background:var(--surface-3);border-color:var(--surface-3);color:transparent;pointer-events:none}
.tile:active{transform:translateY(2px)}

/* Saisie */
.type-box{width:100%;min-height:120px;resize:vertical;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface-2);font-size:1.1rem;font-weight:600;line-height:1.4}
.type-box:focus{outline:none;border-color:var(--dagat);background:var(--surface)}
.type-line{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-size:1.15rem;font-weight:700}
.type-line:focus{outline:none;border-color:var(--dagat);background:var(--surface)}
.gap-line{font-family:var(--f-disp);font-weight:700;font-size:1.3rem;line-height:1.9}
.gap-slot{display:inline-block;min-width:80px;border-bottom:3px solid var(--ink-3);text-align:center;color:var(--dagat);padding:0 6px}
.gap-slot.filled{border-color:var(--dagat)}
.gap-in{display:inline-block;width:9ch;max-width:60vw;font:inherit;color:var(--dagat);border:0;border-bottom:3px solid var(--dagat);background:transparent;text-align:center;padding:0 2px}
.gap-in:focus{outline:none;background:var(--dagat-soft);border-radius:6px 6px 0 0}
.accents{display:flex;gap:6px;flex-wrap:wrap}
.accents button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 10px;font-weight:800}

/* Cartes spéciales */
.intro{display:grid;justify-items:center;text-align:center;gap:14px;padding:12px 0}
.intro .em{font-size:5rem;line-height:1}
.intro .em.txt{font-family:var(--f-disp);font-weight:800;font-size:3.4rem;color:var(--ink-2)}
.intro .word{font-family:var(--f-disp);font-weight:800;font-size:2.4rem;color:var(--dagat);line-height:1.1}
.intro .fr{font-size:1.25rem;font-weight:700}
.vcard{display:grid;gap:10px;justify-items:center;text-align:center;padding:18px;border-radius:20px;border:2px solid var(--line);background:var(--surface)}
.vcard .root{font-family:var(--f-disp);font-weight:800;font-size:2.4rem;color:var(--dagat);line-height:1}
.vcard .chips{justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 12px;font-weight:800;font-size:.85rem;background:var(--surface-2);color:var(--ink-2)}
.chip.aff{background:var(--dagat-soft);color:var(--dagat)}
.chip.asp{background:var(--araw-soft);color:var(--araw-d)}
:root[data-theme="dark"] .chip.asp{color:var(--araw)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.asp{color:var(--araw)}}
.bignum{font-family:var(--f-disp);font-weight:800;font-size:3.6rem;color:var(--ink);line-height:1;text-align:center}
.bay{font-family:var(--f-bay);font-size:4.5rem;line-height:1.2;text-align:center;color:var(--ink)}
.bay.sm{font-size:1.8rem}
.bay-opt{font-family:var(--f-bay);font-size:2rem}

/* Fin de leçon */
.done{display:grid;justify-items:center;text-align:center;gap:18px;padding-top:12px}
.done h1{font-size:2rem;color:var(--araw-d)}
:root[data-theme="dark"] .done h1{color:var(--araw)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .done h1{color:var(--araw)}}
.dtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.dtile{border-radius:16px;border:2px solid var(--c,var(--araw));overflow:hidden;background:var(--c,var(--araw))}
.dtile .lbl{color:#fff;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 4px}
.dtile .val{background:var(--surface);color:var(--c);font-family:var(--f-disp);font-weight:800;font-size:1.5rem;padding:10px 4px;display:flex;align-items:center;justify-content:center;gap:4px}
.dtile .val svg{width:22px;height:22px}
.unlocks{display:grid;gap:8px;width:100%}
.unlock{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.unlock .ico svg{width:32px;height:32px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}

/* Feuilles modales */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(10,16,30,.5);display:grid;align-items:end;justify-items:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:700px){.sheet{border-radius:22px;padding:24px}}
.sheet.wide{max-width:760px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{font-size:1.45rem}

/* Guide (grammaire) */
.doc{display:grid;gap:12px}
.doc h3{font-size:1.2rem;margin-top:8px;color:var(--dagat)}
.doc p{line-height:1.6;max-width:65ch}
.doc .tip{border-radius:14px;padding:12px 14px;background:var(--araw-soft);border:2px solid color-mix(in srgb,var(--araw) 45%,transparent);display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.doc .tip svg{width:24px;height:24px;color:var(--araw-d)}
.exl{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.exl li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-2)}
.exl .mini{width:36px;height:36px;border-radius:10px;border:0;background:var(--dagat);color:#fff;display:grid;place-items:center}
.exl .mini svg{width:20px;height:20px}
.exl .t{font-family:var(--f-disp);font-weight:700;font-size:1.08rem}
.exl .f{font-size:.9rem;color:var(--ink-2)}
.tblw{overflow-x:auto;border-radius:12px;border:2px solid var(--line)}
table.tbl{border-collapse:collapse;width:100%;font-size:.94rem}
.tbl th{background:var(--surface-2);text-align:left;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:8px 10px}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl td .tl{white-space:nowrap}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:800;font-size:.85rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{border-color:var(--dagat);color:var(--dagat);background:var(--dagat-soft)}
.search{position:relative}
.search input{width:100%;padding:13px 14px 13px 44px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.search input:focus{outline:none;border-color:var(--dagat)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--ink-3)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface);border:2px solid var(--line)}
.row .t{font-family:var(--f-disp);font-weight:700;font-size:1.1rem;line-height:1.2}
.row .f{font-size:.9rem;color:var(--ink-2)}
.row .meta{font-size:.75rem;color:var(--ink-3);font-weight:800;text-align:right}
.str{display:inline-flex;gap:2px}
.str i{width:6px;height:14px;border-radius:2px;background:var(--surface-3)}
.str i.on{background:var(--araw)}
.ulist{display:grid;gap:8px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px}
.vc{display:grid;gap:8px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.vc .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vc .top b{font-family:var(--f-disp);font-size:1.2rem}
.vc .forms{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vc .forms div{background:var(--surface-2);border-radius:10px;padding:6px 8px;min-width:0}
.vc .forms small{display:block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.vc .forms .tl{overflow-wrap:anywhere}
.ubtn{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface)}
.ubtn .n{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;color:#fff;background:var(--uc,var(--dagat))}
.ubtn b{display:block;line-height:1.2}
.ubtn div>span{font-size:.85rem;color:var(--ink-2)}

/* Pratique, histoires, profil */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.pcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:18px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface)}
.pcard:hover{background:var(--surface-2)}
.pcard .pi{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--pc,var(--dagat))}
.pcard .pi svg{width:30px;height:30px}
.pcard b{font-family:var(--f-disp);font-size:1.15rem;display:block;line-height:1.2}
.pcard div>span{font-size:.88rem;color:var(--ink-2)}
.pcard[disabled]{opacity:.5;cursor:not-allowed}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px;border-radius:20px;background:var(--surface);border:2px solid var(--line)}
.hero svg.m{width:84px;height:84px}
.hero h1{font-size:1.5rem}
.speech{position:relative;background:var(--surface-2);border-radius:14px;padding:10px 12px;font-weight:700}
.story-card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;padding:14px;border-radius:18px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface)}
.story-card .cover{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;color:#fff;font-family:var(--f-disp);font-weight:800;font-size:1.1rem;background:var(--sc,var(--dagat))}
.story-card b{font-family:var(--f-disp);font-size:1.15rem;display:block}
.story-card div>span{font-size:.88rem;color:var(--ink-2)}
.story-card.locked{opacity:.55}
.sline{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.sline.nar{grid-template-columns:1fr;text-align:center;font-style:italic;color:var(--ink-2)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-disp);font-weight:800;background:var(--av,var(--dagat))}
.sline .who{font-size:.78rem;font-weight:800;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.sline .trans{font-size:.92rem;color:var(--ink-2);margin-top:4px}
.sline .trans[hidden]{display:none}
.sq{border:2px solid var(--araw);background:var(--araw-soft);border-radius:16px;padding:14px;display:grid;gap:10px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.stats-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sg{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.sg .ico svg{width:28px;height:28px}
.sg b{font-family:var(--f-disp);font-size:1.35rem;display:block;line-height:1}
.sg div>span{font-size:.78rem;color:var(--ink-2);font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bdg{display:grid;justify-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
.bdg .medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--araw);color:#4A3500;box-shadow:0 4px 0 var(--araw-d)}
.bdg .medal svg{width:28px;height:28px}
.bdg.off .medal{background:var(--surface-3);color:var(--ink-3);box-shadow:0 4px 0 var(--lock-d)}
.bdg b{font-size:.78rem;line-height:1.2}
.chart{width:100%;height:auto;display:block}
.set{display:grid;gap:14px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.set-row .lbl{font-weight:800}
.set-row .lbl small{display:block;font-weight:600;color:var(--ink-2);font-size:.82rem}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--surface-3);transition:background .2s}
.switch span::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+span{background:var(--tama)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:3px solid var(--araw);outline-offset:2px}
select.sel,input.num-in{padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;max-width:100%}
textarea.json{width:100%;min-height:120px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);padding:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.confirm{display:grid;gap:10px;background:var(--pula-soft);border-radius:14px;padding:12px}
.lvl-ring{width:112px;height:112px;overflow:visible}
/* Mascotte Araw */
svg.m,svg.b,svg.lvl-ring{overflow:visible}
.m-rays{transform-origin:60px 64px;animation:mspin 40s linear infinite}
.m-rays.fast{animation-duration:6s}
.m-body{animation:mbob 3.4s ease-in-out infinite}
.m-hop{animation:mhop 1s ease-in-out 3}
.m-shiver{animation:mshiver .3s linear infinite}
.m-eyes{transform-origin:60px 58px;animation:mblink 5.5s infinite}
.m-drop{animation:mdrop 1.2s linear infinite}
.m-flake{animation:mflake 3.2s linear infinite}
.m-cloud{animation:mdrift 6s ease-in-out infinite}
.m-cloud.slow{animation-duration:9s;animation-direction:reverse}
.m-fog{animation:mdrift 7s ease-in-out infinite}
.m-bolt{animation:mflash 2.6s infinite}
.m-z{animation:mz 3s linear infinite}
.m-wind{stroke-dasharray:28 60;animation:mwind 1.6s linear infinite}
.m-leaf{animation:mleaf 2.4s ease-in-out infinite;transform-origin:106px 34px}
.m-sweat{animation:mdrop 1.8s ease-in infinite}
.m-breath{animation:mbreath 2.4s ease-out infinite}
svg.b *{animation:none!important}
@keyframes mspin{to{transform:rotate(360deg)}}
@keyframes mbob{50%{transform:translateY(-3px)}}
@keyframes mhop{30%{transform:translateY(-10px) scale(1.04)}60%{transform:translateY(0)}}
@keyframes mshiver{25%{transform:translateX(-1.2px)}75%{transform:translateX(1.2px)}}
@keyframes mblink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
@keyframes mdrop{from{transform:translateY(-8px);opacity:0}25%{opacity:1}to{transform:translateY(22px);opacity:0}}
@keyframes mflake{from{transform:translate(0,-8px);opacity:0}25%{opacity:1}to{transform:translate(7px,24px);opacity:0}}
@keyframes mdrift{50%{transform:translateX(7px)}}
@keyframes mflash{0%,84%,100%{opacity:0}86%,90%,94%{opacity:1}88%,92%{opacity:.2}}
@keyframes mz{from{transform:translate(0,0);opacity:0}30%{opacity:1}to{transform:translate(8px,-16px);opacity:0}}
@keyframes mwind{from{stroke-dashoffset:88}to{stroke-dashoffset:0}}
@keyframes mleaf{50%{transform:translate(-8px,6px) rotate(-30deg)}}
@keyframes mbreath{from{opacity:0;transform:translateX(0)}40%{opacity:1}to{opacity:0;transform:translateX(8px)}}
.side svg.m{width:76px;height:76px}
.unlock .ico{color:var(--dagat)}
.wx{display:grid;gap:6px}
.wx-pill{justify-self:start;display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;background:var(--araw-soft);color:var(--ink);font-weight:800;font-size:.8rem}
.wx-pill .ico svg{width:16px;height:16px;color:var(--araw-d)}

/* ====== Mouvement ====== */
.opt,.pic,.pb,.tile{transition:transform .16s cubic-bezier(.34,1.56,.64,1),background-color .18s,border-color .18s,color .18s,opacity .25s}
.opt:active,.pic:active,.pb:active,.tile:active{transform:scale(.95)}
.opt.sel,.pic.sel,.pb.sel{animation:selpop .28s cubic-bezier(.34,1.56,.64,1)}
.opt.right,.pic.right{animation:rightpop .5s cubic-bezier(.34,1.56,.64,1)}
.opt.wrong,.pic.wrong{animation:shake .42s}
.pb.gone{transform:scale(.9)}
@keyframes selpop{from{transform:scale(.93)}}
@keyframes rightpop{40%{transform:scale(1.05)}}
.pfoot{transition:background-color .3s,border-color .3s}
.meter.glint i::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.8) 48%,transparent 62%);background-size:260% 100%;animation:glint .9s ease-out forwards}
@keyframes glint{from{background-position:130% 0}to{background-position:-40% 0}}
.meter.hot i{background:linear-gradient(90deg,#F2B300,#FF7A1A);animation:hotpulse 1.3s ease-in-out infinite}
@keyframes hotpulse{50%{filter:brightness(1.18) saturate(1.2)}}
.badge-ic{position:relative}
.badge-ic.burst::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--tama);animation:ring .65s ease-out forwards;pointer-events:none}
.node-wrap.burst::after{content:"";position:absolute;left:50%;top:32px;width:86px;height:86px;margin:-43px 0 0 -43px;border-radius:50%;border:5px solid var(--araw);animation:ring .9s ease-out .3s both;pointer-events:none}
@keyframes ring{from{opacity:.95;transform:scale(.55)}to{opacity:0;transform:scale(1.7)}}
.ph .hearts{position:relative}
.dmg{position:absolute;right:-2px;top:-6px;font-weight:800;color:var(--pula);pointer-events:none;animation:dmg .95s ease-out forwards}
@keyframes dmg{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-30px) scale(1.25)}}
.bubble.dots{display:inline-flex;gap:5px;padding:15px 16px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.scrim{animation:fadeIn .22s ease-out}
.sheet{animation:sheetUp .42s cubic-bezier(.22,1,.36,1)}
@media (min-width:700px){.sheet{animation-name:sheetPop}}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{opacity:0;transform:translateY(70px)}}
@keyframes sheetPop{from{opacity:0;transform:translateY(18px) scale(.95)}}
.pop{animation:popIn .3s cubic-bezier(.34,1.56,.64,1);transform-origin:50% 0}
@keyframes popIn{from{opacity:0;transform:translateX(calc(-50% - var(--x,0px))) translateY(-10px) scale(.88)}}
.main{view-transition-name:main}
.tabbar{view-transition-name:tabbar}.rail{view-transition-name:rail}.side{view-transition-name:side}
::view-transition-old(main){animation:vt-out .2s cubic-bezier(.55,0,1,.45) both}
::view-transition-new(main){animation:vt-in .36s cubic-bezier(.22,1,.36,1) both}
:root[data-vt="back"]::view-transition-old(main){animation-name:vt-out-back}
:root[data-vt="back"]::view-transition-new(main){animation-name:vt-in-back}
::view-transition-old(root),::view-transition-new(root){animation-duration:.25s}
@keyframes vt-out{to{opacity:0;transform:translateX(-34px)}}
@keyframes vt-in{from{opacity:0;transform:translateX(46px)}}
@keyframes vt-out-back{to{opacity:0;transform:translateX(34px)}}
@keyframes vt-in-back{from{opacity:0;transform:translateX(-46px)}}

/* ---------- Compte en ligne ---------- */
.acct{display:grid;gap:14px}
.acct-intro{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;color:var(--dagat)}
.acct-intro .ico svg{width:30px;height:30px}
.acct-intro b{display:block;color:var(--ink);font-size:1.05rem}
.acct-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.acct-id{display:grid;min-width:0;flex:1}
.acct-id b{font-size:1.05rem;overflow:hidden;text-overflow:ellipsis}
.acct-id span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:.78rem;font-weight:800;white-space:nowrap}
.pill .ico svg{width:15px;height:15px}
.pill.ok{background:var(--tama-soft);color:var(--tama-d)}
.pill.bad{background:var(--pula-soft);color:var(--pula-d)}
.acct-msg{padding:10px 12px;border-radius:12px;font-weight:700;font-size:.9rem}
.acct-msg.bad{background:var(--pula-soft);color:var(--pula-d)}
.acct-msg.ok{background:var(--tama-soft);color:var(--tama-d)}
.auth-form{display:grid;gap:14px;max-width:440px}
.auth-form label{display:grid;gap:6px;font-weight:800;font-size:.92rem}
.auth-form .type-line{font-size:1rem;padding:11px 13px}
.pw{position:relative;display:block}
.pw .type-line{padding-right:92px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--dagat);font-weight:800;font-size:.82rem;padding:8px 10px;border-radius:10px;cursor:pointer}
.hint-s{font-weight:600;font-size:.8rem;color:var(--ink-2)}
.link-btn{justify-self:start;border:0;background:none;padding:4px 0;color:var(--dagat);font-weight:800;font-size:.9rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.hist{display:grid;gap:0;padding:6px 16px}
.hist-row{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hist-row:last-child{border-bottom:0}
.hist-row .tag{grid-row:span 2;align-self:start;font-size:.7rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:8px;background:var(--dagat-soft);color:var(--dagat)}
.hist-t{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-acct{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.side-acct .ico{color:var(--dagat)}
.nudge{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:12px 12px 12px 16px;border-radius:var(--r);background:var(--dagat-soft);color:var(--dagat)}
.nudge>span{display:grid;min-width:0;color:var(--ink)}
.nudge .icon-btn{width:36px;height:36px}
@media (max-width:520px){.nudge{grid-template-columns:auto 1fr auto}.nudge .btn{grid-column:1/-1;grid-row:2}}
@media (min-width:1220px){.nudge{display:none}}
:root[data-theme="dark"] .pill.ok,:root[data-theme="dark"] .acct-msg.ok{background:rgba(31,157,85,.18);color:#7FE0A6}
:root[data-theme="dark"] .pill.bad,:root[data-theme="dark"] .acct-msg.bad{background:rgba(215,38,61,.2);color:#FF9AA8}
:root[data-theme="dark"] .nudge,:root[data-theme="dark"] .hist-row .tag{background:rgba(22,82,200,.22);color:#9DBBFF}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .pill.ok,:root:not([data-theme="light"]) .acct-msg.ok{background:rgba(31,157,85,.18);color:#7FE0A6}
  :root:not([data-theme="light"]) .pill.bad,:root:not([data-theme="light"]) .acct-msg.bad{background:rgba(215,38,61,.2);color:#FF9AA8}
  :root:not([data-theme="light"]) .nudge,:root:not([data-theme="light"]) .hist-row .tag{background:rgba(22,82,200,.22);color:#9DBBFF}
}
/* ---------- Mode ultra ---------- */
.switch input:disabled{cursor:not-allowed}.switch input:disabled+span{opacity:.5}
.ultra-card{position:relative;display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);cursor:pointer;color:#fff;overflow:hidden;isolation:isolate;
  background:linear-gradient(135deg,#1D2160,#3B1F7A 55%,#5A2A8E);box-shadow:0 6px 22px -10px rgba(59,31,122,.8);-webkit-tap-highlight-color:transparent}
.ultra-card .ub{flex:none;width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#FFE45C}
.ultra-card .ub svg{width:30px;height:30px}
.ultra-card .lbl{flex:1;min-width:0;font-weight:800;font-size:1.06rem;line-height:1.25}
.ultra-card .lbl small{display:block;margin-top:3px;font-weight:600;font-size:.84rem;color:#DCD6FF}
.ultra-card .switch span{background:rgba(255,255,255,.24)}
.ultra-card .switch input:checked+span{background:linear-gradient(90deg,#FFB300,#FFE45C)}
.ultra-card .switch input:checked+span::after{box-shadow:0 0 10px 2px rgba(255,228,92,.9)}
.ultra-card.on{background:linear-gradient(135deg,#151A63,#4A1FA3 50%,#7B2CC2);box-shadow:inset 0 0 0 2px rgba(255,228,92,.85),0 10px 30px -10px rgba(123,44,194,.85)}
.ultra-card.on::before{content:"";position:absolute;inset:-60%;z-index:-1;background:conic-gradient(from 0deg,transparent 0 62%,rgba(255,228,92,.28) 74%,transparent 86%);animation:uspin 4s linear infinite}
.ultra-card.on .ub{background:rgba(255,228,92,.16);box-shadow:0 0 18px rgba(255,228,92,.35)}
.ultra-card.on .ub svg{animation:ubolt 2.6s ease-in-out infinite}
.ultra-card.still::before,.ultra-card.still .ub svg{animation:none}
.ultra-card.zap{animation:uzap .6s cubic-bezier(.34,1.56,.64,1)}
.ultra-card.zap .ub{animation:uzapb .7s ease-out}
.ultra-card.unzap{animation:uunzap .5s ease-out}
.ultra-card.zap-soft{animation:usoft .6s ease-out}
@keyframes uspin{to{transform:rotate(1turn)}}
@keyframes ubolt{0%,84%,100%{transform:none;filter:none}88%{transform:scale(1.2) rotate(-9deg);filter:drop-shadow(0 0 8px #FFE45C)}93%{transform:scale(.94) rotate(4deg)}}
@keyframes uzap{0%{transform:scale(.96);filter:brightness(2.2) saturate(1.4)}45%{transform:scale(1.025);filter:brightness(1.25)}100%{transform:none;filter:none}}
@keyframes uzapb{0%{transform:scale(.6) rotate(-25deg)}55%{transform:scale(1.3) rotate(8deg);box-shadow:0 0 34px 8px rgba(255,228,92,.8)}100%{transform:none}}
@keyframes uunzap{0%{filter:grayscale(1) brightness(.8)}100%{filter:none}}
@keyframes usoft{0%{box-shadow:0 0 0 4px #FFE45C}100%{box-shadow:0 0 0 0 transparent}}
.btn.ultra-btn{--cd:#2B1566;--fg:#fff;color:#fff;background:linear-gradient(135deg,#2A2F8F,#6B2BC0)}
.btn.ultra-btn .ico{color:#FFE45C}
.ultra-note{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#1D2160,#5A2A8E)}
.ultra-note .ico{color:#FFE45C;flex:none}
.stat.ult .ico svg{filter:drop-shadow(0 0 2.5px currentColor)}
.ultra-fx{position:fixed;inset:0;pointer-events:none;z-index:110;overflow:hidden}
.ultra-fx svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ultra-fx .bolt{filter:drop-shadow(0 0 6px #A9C1FF) drop-shadow(0 0 18px #6C5CFF)}
.ultra-fx polyline{fill:none;stroke-linejoin:round;stroke-linecap:round}
.ultra-fx .core{stroke:#fff;stroke-width:3.4}
.ultra-fx .glow{stroke:#C7D5FF;stroke-width:10;opacity:.45}
.ultra-fx .br{stroke:#EEF2FF;stroke-width:1.8}
.ultra-fx .flash{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at var(--x) var(--y),#fff 0,rgba(222,230,255,.9) 14%,rgba(150,160,255,.35) 42%,rgba(90,60,200,.08) 70%,transparent 85%)}
.ultra-fx .ring{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #FFE45C;box-shadow:0 0 16px #FFE45C,inset 0 0 10px #FFE45C;opacity:0}
.ultra-fx.off .ring{border-color:#9AA3B8;box-shadow:none}
.ultra-fx .sp{position:absolute;width:3px;height:16px;margin:-8px 0 0 -1.5px;border-radius:2px;background:linear-gradient(#fff,#FFE45C);opacity:0;transform-origin:50% 50%}
.ultra-fx.off .sp{background:#9AA3B8;height:9px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
